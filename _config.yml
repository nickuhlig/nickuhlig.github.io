port: 3000
url: https://www.nuhlig.com
permalink: /:title
markdown: kramdown
# Since GH pages override this to "true", we test this value to see if we are running locally
safe: false
include: [".well-known"]
# tools/ holds the refresh scripts (not part of the site). Note: setting `exclude` replaces Jekyll's
# default list, so the usual suspects are repeated here.
exclude: [tools, Gemfile, Gemfile.lock, node_modules, vendor]
encoding: UTF-8
# one file per made-in-Canada brand; no page each, they're read by
# projects/madeincanada/brands.json (allowed values: _data/madeincanada.yml)
collections:
  brands:
    output: false
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter_opts:
      disable: true
